apiVersion: v1
kind: Secret
metadata:
  name: docupilot-secrets
  namespace: docupilot
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-strong-random-secret"
  DATABASE_URL: "postgresql://docupilot:docupilot@postgres:5432/docupilot"
  # Optional LLM keys:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
